        - generic [ref=e57]:
          - generic [ref=e58]:
            - heading "The real cost is lessons plus official fees" [level=2] [ref=e59]
            - generic [ref=e60]:
              - paragraph [ref=e61]: Most learners should budget for instructor lessons, the theory test, the practical test, and possible extra practice close to test day. The official practical car test fee is lower than the lesson total for most learners, but it still matters when planning.
              - paragraph [ref=e62]: RAC guidance puts many current UK lesson prices around the mid-£30s to mid-£40s per hour, with local variation. Norwich prices can sit within that range, but the only honest number is the rate your chosen instructor actually publishes.
          - generic [ref=e63]:
            - heading "What changes lesson price" [level=2] [ref=e64]
            - generic [ref=e65]:
              - paragraph [ref=e66]: Instructor experience, location, fuel and insurance costs, car type, lesson length, peak-time demand, and whether you learn manual or automatic can all affect the rate.
              - paragraph [ref=e67]: Block booking can sometimes reduce the per-hour price, but do not buy a large block until you are comfortable with the instructor and their teaching style.
            - generic [ref=e68]:
              - generic [ref=e69]:
                - heading "Manual lessons" [level=3] [ref=e70]
                - paragraph [ref=e71]: Often easier to find and may give more instructor choice in some areas.
                - link "Read more" [ref=e72] [cursor=pointer]:
                  - /url: /guides/manual-vs-automatic
              - generic [ref=e73]:
                - heading "Automatic lessons" [level=3] [ref=e74]
                - paragraph [ref=e75]: Can be simpler mechanically for some learners, but availability and hourly cost can vary by area.
                - link "Read more" [ref=e76] [cursor=pointer]:
                  - /url: /guides/manual-vs-automatic
              - generic [ref=e77]:
                - heading "Test-centre preparation" [level=3] [ref=e78]
                - paragraph [ref=e79]: Extra lessons near a test centre may be useful, but they should develop judgement rather than memorised routes.
                - link "Read more" [ref=e80] [cursor=pointer]:
                  - /url: /test-centres
          - generic [ref=e81]:
            - heading "How Newdryve pricing works" [level=2] [ref=e82]
            - generic [ref=e83]:
              - paragraph [ref=e84]: Newdryve does not charge learners a booking fee. Instructors set their own lesson rates, and learners can see the rate before booking. You pay your instructor for the lesson.
              - paragraph [ref=e85]: That means your comparison should focus on fit, availability, car type, pickup area, and the instructor rate shown, rather than hidden platform charges.
