            - heading "What learning to drive in Norwich involves" [level=2] [ref=e59]
            - generic [ref=e60]:
              - paragraph [ref=e61]: Norwich learners usually need a mix of quiet residential practice, busier urban junctions, ring-road driving, roundabouts, dual-carriageway confidence, and independent driving practice before they are ready for a practical test.
              - paragraph [ref=e62]: The right instructor is not just someone with a free slot. You want an ADI-qualified instructor who can explain progress clearly, fit lessons around your week, and prepare you for the test centre that makes practical sense for your area.
            - generic [ref=e63]:
              - generic [ref=e64]:
                - heading "Peachman Way" [level=3] [ref=e65]
                - paragraph [ref=e66]: Useful for many learners on the east, north-east, and Broadland side of Norwich. See the dedicated centre guide before choosing it.
                - link "Read more" [ref=e67] [cursor=pointer]:
                  - /url: /test-centres/norwich-peachman-way
              - generic [ref=e68]:
                - heading "Jupiter Road" [level=3] [ref=e69]
                - paragraph [ref=e70]: A north Norwich option near Hellesdon and the airport side of the city. Use the dedicated page for address and preparation notes.
                - link "Read more" [ref=e71] [cursor=pointer]:
                  - /url: /test-centres/norwich-jupiter-road
              - generic [ref=e72]:
                - heading "Norfolk alternatives" [level=3] [ref=e73]
                - paragraph [ref=e74]: King's Lynn, Lowestoft, and Bury St Edmunds can matter for some edge-of-county learners, but do not switch centres just to chase a date without asking your instructor.
                - link "Read more" [ref=e75] [cursor=pointer]:
                  - /url: /test-centres
          - generic [ref=e76]:
            - heading "How Newdryve helps learners find an instructor" [level=2] [ref=e77]
            - generic [ref=e78]:
              - paragraph [ref=e79]: Newdryve is built around real instructor availability. Instead of sending messages and waiting for replies, learners can see instructors, lesson types, rates, specialisms, pickup areas, and open slots.
              - paragraph [ref=e80]: Every Newdryve instructor profile is checked before it goes live. Learners do not pay Newdryve a booking fee or platform fee; you pay your instructor for lessons. Android learners can use Google Play now, and iOS learners can join the waitlist while the iOS app is prepared.
            - generic [ref=e81]:
              - generic [ref=e82]:
                - heading "Check fit before you book" [level=3] [ref=e83]
                - paragraph [ref=e84]: Look for transmission type, lesson location, rate, availability, and whether the instructor knows the test centre you expect to use.
                - link "Read more" [ref=e85] [cursor=pointer]:
                  - /url: /guides/how-to-find-a-driving-instructor
              - generic [ref=e86]:
                - heading "Plan your budget" [level=3] [ref=e87]
                - paragraph [ref=e88]: Lesson prices vary by instructor and area. Our cost guide explains the moving parts without pretending there is one universal Norwich price.
                - link "Read more" [ref=e89] [cursor=pointer]:
                  - /url: /guides/driving-lesson-cost
              - generic [ref=e90]:
                - heading "Track readiness" [level=3] [ref=e91]
                - paragraph [ref=e92]: Use lessons to build the full skill set rather than counting hours alone. Hours matter, but quality and practice between lessons matter too.
                - link "Read more" [ref=e93] [cursor=pointer]:
                  - /url: /guides/how-many-lessons-to-pass
          - generic [ref=e94]:
            - heading "A sensible Norwich learner route" [level=2] [ref=e95]
            - generic [ref=e96]:
              - paragraph [ref=e97]: Start with instructor fit and availability, then talk through which test centre suits your pickup area and regular driving routes. Once your instructor thinks you are nearing test standard, check official test availability and book only through GOV.UK.
              - paragraph [ref=e98]: If slots are scarce, keep lessons moving. A booking date is useful only if you are genuinely ready by then; otherwise it can add pressure and cost.
